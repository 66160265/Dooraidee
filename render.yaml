services:
  - type: web
    name: dooraidee-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: MAL_CLIENT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
